<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>לאישור</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/foryou.css">
</head>
<body class="fy">
  <header class="fy-top" id="top">
    <div class="fy-top-row">
      <a class="fy-back" href="/" aria-label="חזרה למסך הבית">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </a>
      <div class="fy-left" id="left" aria-live="polite"></div>
    </div>
    <nav class="fy-chips" id="chips" aria-label="מעבר ללקוח"></nav>
  </header>

  <main class="fy-feed" id="feed" aria-label="סרטונים לאישור"></main>

  <div class="fy-loading" id="loading" aria-hidden="true"><span></span></div>

  <button class="fy-clean-exit" id="cleanExit" type="button" aria-label="יציאה ממסך נקי">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
  </button>

  <div class="fy-sheet-root" id="sheetRoot"></div>
  <div class="fy-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/foryou.js" defer></script>
</body>
</html>
