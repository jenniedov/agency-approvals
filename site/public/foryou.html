<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>לאישור</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/foryou.css">
</head>
<body class="fy">
  <header class="fy-top" id="top">
    <button class="fy-title" id="titleBtn" type="button" aria-label="מעבר ללקוח">
      <h1>לאישור</h1>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5l5.5 5.5 5.5-5.5" /></svg>
    </button>
    <span class="fy-count" id="count" aria-live="polite"></span>
    <span class="fy-speed" id="speedTag"></span>
    <span class="fy-grow"></span>
    <button class="fy-sound" id="soundBtn" type="button" aria-label="השתקה"></button>
    <button class="fy-chip" id="clientChip" type="button" aria-label="מעבר ללקוח"></button>
  </header>

  <main class="fy-feed" id="feed" aria-label="סרטונים לאישור"></main>

  <nav class="fy-tabs" aria-label="ניווט ראשי">
    <a href="/" aria-label="בית"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.2L12 3.2l8.5 7V20.5h-5.6v-6.2H9.1v6.2H3.5z" /></svg></a>
    <a href="/#/clients" aria-label="לקוחות"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.6" /><path d="M2.5 20c.6-3.6 3.2-5.6 6.5-5.6s5.9 2 6.5 5.6" /><path d="M15.5 4.6a3.5 3.5 0 0 1 0 6.8M18 14.6c2 .7 3.2 2.5 3.5 5.4" /></svg></a>
    <a href="/foryou" aria-label="לאישור" aria-current="page" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" class="tf" /><path d="M2.5 8h19M8.6 2.6L11.6 8M14.4 2.6l3 5.4" class="tk" /><path d="M10 11.2v6.6l5.6-3.3z" class="tp" /></svg></a>
    <a href="/#/schedule" aria-label="לוח"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3.5" /><path d="M3 9.5h18M8 2.5v4M16 2.5v4" /></svg></a>
    <a href="/#/settings" aria-label="הגדרות"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4.9a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.4A7.5 7.5 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a7.5 7.5 0 0 0 2.6-1.5l2.4.9 2-3.4z" /></svg></a>
  </nav>

  <div class="fy-loading" id="loading" aria-hidden="true"><span></span></div>
  <div class="fy-sheet-root" id="sheetRoot"></div>
  <div class="fy-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/foryou.js" defer></script>
</body>
</html>
