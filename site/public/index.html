<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>מערכת האישורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">לדלג לתוכן</a>
<div class="shell" id="shell" hidden>
  <nav class="side" aria-label="ניווט ראשי">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span><span class="brand-name" data-brand></span></div>
    <div class="nav-list" data-nav></div>
    <div class="side-clients" data-side-clients></div>
    <div class="machine-box" data-machine-box></div>
  </nav>
  <div class="main-col">
    <header class="topbar">
      <div class="topbar-brand"><span class="brand-dot" aria-hidden="true"></span><span data-brand></span></div>
      <div class="topbar-spacer"></div>
      <div class="bell-wrap">
        <button type="button" class="bell" id="bell" aria-haspopup="true" aria-expanded="false" aria-controls="notif-panel" aria-label="התראות">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="bell-count" id="bell-count" hidden></span>
        </button>
        <div class="notif-panel" id="notif-panel" role="region" aria-label="התראות" hidden></div>
      </div>
    </header>
    <main id="main" class="page" tabindex="-1" aria-live="polite"></main>
  </div>
  <nav class="tabbar" aria-label="ניווט ראשי" data-tabbar></nav>
</div>
<main id="solo" class="solo" hidden></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js"></script>
</body>
</html>
